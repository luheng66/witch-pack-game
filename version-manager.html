<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版本管理 - 女巫背包</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .backup-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .backup-section h2 {
            color: #555;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-download {
            background: #17a2b8;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-download:hover {
            background: #138496;
        }

        .versions-section h2 {
            color: #555;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .version-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .version-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .version-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .version-info {
            flex: 1;
        }

        .version-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .version-date {
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .version-description {
            color: #888;
            font-size: 14px;
        }

        .version-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        .toast.info {
            background: #17a2b8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .instructions {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #533f03;
        }

        .instructions ol {
            margin-left: 20px;
        }

        .instructions li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 版本管理</h1>

        <div class="instructions">
            <h3>📖 使用说明</h3>
            <ol>
                <li><strong>创建备份</strong>：输入描述后点击"保存版本"，会下载一个包含所有游戏文件的压缩包</li>
                <li><strong>恢复版本</strong>：点击"恢复"按钮，上传之前下载的压缩包来恢复游戏文件</li>
                <li><strong>删除版本</strong>：点击"删除"按钮，从本地存储中移除该版本记录</li>
                <li><strong>下载备份</strong>：点击"下载"按钮，重新下载该版本的压缩包</li>
            </ol>
        </div>

        <div class="backup-section">
            <h2>💾 创建备份</h2>
            <div class="input-group">
                <input type="text" id="description" placeholder="输入版本描述（例如：新增拖拽功能）">
                <button class="btn btn-primary" onclick="createBackup()">保存版本</button>
            </div>
        </div>

        <div class="versions-section">
            <h2>📋 版本列表</h2>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>处理中...</div>
            </div>
            <div class="version-list" id="versionList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <input type="file" id="restoreInput" accept=".zip" style="display: none;">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>
        const STORAGE_KEY = 'witch_pack_versions';
        const FILES_TO_BACKUP = ['index.html', 'login.html', 'loading.html', 'game.js', 'styles.css'];

        async function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function getVersions() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (error) {
                console.error('读取版本列表失败:', error);
                return [];
            }
        }

        function saveVersions(versions) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(versions));
                return true;
            } catch (error) {
                console.error('保存版本列表失败:', error);
                return false;
            }
        }

        async function fetchFile(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.text();
            } catch (error) {
                console.error('获取文件失败:', url, error);
                return null;
            }
        }

        async function fetchAsset(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.blob();
            } catch (error) {
                console.error('获取资源失败:', url, error);
                return null;
            }
        }

        async function createBackup() {
            const description = document.getElementById('description').value.trim();
            if (!description) {
                showToast('请输入版本描述', 'error');
                return;
            }

            const loading = document.getElementById('loading');
            loading.classList.add('active');

            try {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                const version = `v_${timestamp}`;
                const zip = new JSZip();

                // 添加主要文件
                for (const file of FILES_TO_BACKUP) {
                    const content = await fetchFile(file);
                    if (content) {
                        zip.file(file, content);
                    }
                }

                // 添加assets目录
                const assetFiles = [
                    'assets/images/icons/potion.svg',
                    'assets/images/icons/herb.svg',
                    'assets/images/icons/book.svg',
                    'assets/images/icons/broom.svg',
                    'assets/images/icons/mushroom.svg',
                    'assets/images/icons/crystal.svg',
                    'assets/images/icons/coin.svg',
                    'assets/images/icons/scroll.svg',
                    'assets/images/icons/fire.svg',
                    'assets/images/icons/cloth.svg',
                    'assets/images/icons/wand.svg',
                    'assets/images/icons/lantern.svg'
                ];

                for (const assetFile of assetFiles) {
                    const blob = await fetchAsset(assetFile);
                    if (blob) {
                        zip.file(assetFile, blob);
                    }
                }

                // 生成压缩包
                const content = await zip.generateAsync({ type: 'blob' });
                const fileName = `witch-pack-${version}.zip`;
                saveAs(content, fileName);

                // 保存版本记录
                const versions = getVersions();
                const newVersion = {
                    version,
                    description,
                    date: new Date().toLocaleString('zh-CN'),
                    fileName
                };
                versions.push(newVersion);
                saveVersions(versions);

                showToast(`备份成功: ${version}`);
                document.getElementById('description').value = '';
                loadVersions();
            } catch (error) {
                showToast('备份失败: ' + error.message, 'error');
            } finally {
                loading.classList.remove('active');
            }
        }

        function restoreVersion(version) {
            const input = document.getElementById('restoreInput');
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const loading = document.getElementById('loading');
                loading.classList.add('active');

                try {
                    const zip = await JSZip.loadAsync(file);
                    const files = Object.keys(zip.files);

                    for (const filename of files) {
                        if (filename.endsWith('/')) continue;

                        const content = await zip.files[filename].async('blob');
                        const url = URL.createObjectURL(content);
                        
                        // 创建下载链接
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }

                    showToast(`版本 ${version} 的文件已下载，请手动替换游戏文件`, 'info');
                } catch (error) {
                    showToast('恢复失败: ' + error.message, 'error');
                } finally {
                    loading.classList.remove('active');
                    input.value = '';
                }
            };
            input.click();
        }

        function deleteVersion(version) {
            if (!confirm(`确定要删除版本 ${version} 的记录吗？`)) {
                return;
            }

            const versions = getVersions().filter(v => v.version !== version);
            saveVersions(versions);
            showToast(`已删除版本记录: ${version}`);
            loadVersions();
        }

        function downloadBackup(version) {
            const versions = getVersions();
            const versionData = versions.find(v => v.version === version);
            
            if (versionData && versionData.fileName) {
                showToast(`请从浏览器下载记录中找到 ${versionData.fileName}`, 'info');
            } else {
                showToast('找不到备份文件', 'error');
            }
        }

        function loadVersions() {
            const versionList = document.getElementById('versionList');
            const versions = getVersions();

            if (versions.length === 0) {
                versionList.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <div>暂无备份版本</div>
                    </div>
                `;
                return;
            }

            versions.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(v => {
                const item = document.createElement('div');
                item.className = 'version-item';
                item.innerHTML = `
                    <div class="version-info">
                        <div class="version-name">${v.version}</div>
                        <div class="version-date">${v.date}</div>
                        <div class="version-description">${v.description}</div>
                    </div>
                    <div class="version-actions">
                        <button class="btn btn-success" onclick="restoreVersion('${v.version}')">恢复</button>
                        <button class="btn btn-download" onclick="downloadBackup('${v.version}')">下载</button>
                        <button class="btn btn-danger" onclick="deleteVersion('${v.version}')">删除</button>
                    </div>
                `;
                versionList.appendChild(item);
            });
        }

        document.addEventListener('DOMContentLoaded', loadVersions);
    </script>
</body>
</html>
