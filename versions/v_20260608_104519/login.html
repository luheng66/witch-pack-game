<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔法背包 - 登录</title>
  <style>
    :root {
      --ink: #241b2f;
      --muted: #73677f;
      --bg: #f7efe3;
      --paper: #fff8ec;
      --violet: #6b4ba1;
      --violet-soft: #c4b5fd;
      --mint: #8fd5b2;
      --gold: #f3c66d;
      --shadow: 0 18px 50px rgba(54, 38, 27, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(143, 213, 178, 0.3), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(107, 75, 161, 0.2), transparent 35%),
        linear-gradient(145deg, #f7efe3 0%, #f0dfc8 100%);
    }

    .login-container {
      width: min(420px, 90vw);
      padding: 48px 40px;
      border-radius: 28px;
      background: rgba(255, 248, 236, 0.95);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--violet) 0%, #5a3d8a 100%);
      display: grid;
      place-items: center;
      font-size: 56px;
      color: #fff;
      box-shadow: 0 12px 32px rgba(107, 75, 161, 0.4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 900;
      color: var(--ink);
    }

    .subtitle {
      margin: 0 0 40px;
      color: var(--muted);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .form-group input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border: 2px solid #e8dcc8;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--violet);
      box-shadow: 0 0 0 4px rgba(107, 75, 161, 0.1);
    }

    .form-group input::placeholder {
      color: #b8ab9a;
    }

    .btn-login {
      width: 100%;
      height: 56px;
      margin-top: 8px;
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(145deg, var(--violet) 0%, #5a3d8a 100%);
      box-shadow: 0 12px 28px rgba(107, 75, 161, 0.35);
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(107, 75, 161, 0.45);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .links {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    .links a {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      transition: color 200ms ease;
    }

    .links a:hover {
      color: var(--violet);
    }

    .guest-mode {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e8dcc8;
    }

    .btn-guest {
      padding: 12px 24px;
      border: 2px dashed var(--violet);
      border-radius: 12px;
      color: var(--violet);
      font-size: 14px;
      font-weight: 700;
      background: transparent;
      cursor: pointer;
      transition: all 200ms ease;
    }

    .btn-guest:hover {
      background: rgba(107, 75, 161, 0.08);
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 24px;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      background: rgba(36, 27, 47, 0.9);
      opacity: 0;
      transition: opacity 300ms ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">🎒</div>
    <h1>魔法背包</h1>
    <p class="subtitle">Magic Backpack</p>
    
    <div class="form-group">
      <label for="username">账号</label>
      <input type="text" id="username" placeholder="请输入账号">
    </div>
    
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    
    <button class="btn-login" id="loginBtn">登录</button>
    
    <div class="links">
      <a href="#" id="registerLink">注册</a>
      <a href="#" id="forgotLink">忘记密码</a>
    </div>
    
    <div class="guest-mode">
      <button class="btn-guest" id="guestBtn">游客模式</button>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    const els = {
      username: document.querySelector('#username'),
      password: document.querySelector('#password'),
      loginBtn: document.querySelector('#loginBtn'),
      guestBtn: document.querySelector('#guestBtn'),
      toast: document.querySelector('#toast')
    };

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      setTimeout(() => {
        els.toast.classList.remove('show');
      }, 2000);
    }

    function validateForm() {
      const username = els.username.value.trim();
      const password = els.password.value.trim();
      return username.length >= 3 && password.length >= 6;
    }

    els.username.addEventListener('input', () => {
      els.loginBtn.disabled = !validateForm();
    });

    els.password.addEventListener('input', () => {
      els.loginBtn.disabled = !validateForm();
    });

    els.loginBtn.addEventListener('click', () => {
      const username = els.username.value.trim();
      const password = els.password.value.trim();
      
      const savedUsers = JSON.parse(localStorage.getItem('users') || '{}');
      
      if (savedUsers[username] && savedUsers[username] === password) {
        localStorage.setItem('currentUser', username);
        localStorage.setItem('isLoggedIn', 'true');
        showToast('登录成功');
        setTimeout(() => {
          window.location.href = 'loading.html';
        }, 1500);
      } else {
        showToast('账号或密码错误');
      }
    });

    els.guestBtn.addEventListener('click', () => {
      localStorage.setItem('currentUser', 'guest');
      localStorage.setItem('isLoggedIn', 'true');
      showToast('进入游客模式');
      setTimeout(() => {
        window.location.href = 'loading.html';
      }, 1500);
    });

    document.querySelector('#registerLink').addEventListener('click', (e) => {
      e.preventDefault();
      const username = els.username.value.trim();
      const password = els.password.value.trim();
      
      if (username.length < 3) {
        showToast('账号至少需要3个字符');
        return;
      }
      if (password.length < 6) {
        showToast('密码至少需要6个字符');
        return;
      }
      
      const savedUsers = JSON.parse(localStorage.getItem('users') || '{}');
      
      if (savedUsers[username]) {
        showToast('该账号已存在');
        return;
      }
      
      savedUsers[username] = password;
      localStorage.setItem('users', JSON.stringify(savedUsers));
      showToast('注册成功，请登录');
    });

    document.querySelector('#forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('请联系管理员找回密码');
    });

    if (localStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'loading.html';
    }
  </script>
</body>
</html>
